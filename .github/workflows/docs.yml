name: Docs

on:
  push:
    branches: [main]
    # The complete set of inputs to `zensical build`: published pages/assets,
    # the theme overrides, the config, and this workflow. (README.md is NOT an
    # input — the site's home is docs/user/index.md, not the README.)
    paths:
      - "docs/user/**"
      - "docs/overrides/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Deploy straight to GitHub Pages from Actions — no gh-pages branch.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.8.10"
          python-version: "3.13"

      - name: Sync docs dependencies
        run: uv sync --group docs

      - name: Build site (strict — fails on broken links/nav)
        run: uv run zensical build -f mkdocs.yml --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
