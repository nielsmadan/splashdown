name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build deps
        run: python -m pip install --quiet build pytest

      - name: Test
        run: python -m pytest tests/ -q

      - name: Build sdist + wheel
        run: python -m build

      - name: Compute source tarball SHA256
        run: |
          curl -fsSL -o /tmp/source.tar.gz \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          TARBALL_SHA=$(shasum -a 256 /tmp/source.tar.gz | cut -d' ' -f1)
          echo "TARBALL_SHA=$TARBALL_SHA" >> "$GITHUB_ENV"
          echo "Source tarball SHA256: $TARBALL_SHA"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s" "${PREV_TAG}..${GITHUB_REF_NAME}" \
              | grep -v "^- chore:" | grep -v "^- Merge " || true)
            CHANGELOG_LINK="**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
          else
            NOTES="- Initial release"
            CHANGELOG_LINK=""
          fi
          {
            echo "## What's Changed"
            echo ""
            echo "$NOTES"
            echo ""
            echo "$CHANGELOG_LINK"
          } > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "splashdown $VERSION" \
            --notes-file /tmp/release-notes.md

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/nielsmadan/homebrew-tap.git" \
            "$RUNNER_TEMP/homebrew-tap"

          FORMULA_FILE="$RUNNER_TEMP/homebrew-tap/Formula/splashdown.rb"

          # Update url (any prior tag pattern -> new tag) and sha256.
          sed -i "s|tags/v[^\"]*\.tar\.gz|tags/${GITHUB_REF_NAME}.tar.gz|" "$FORMULA_FILE"
          sed -i "s/sha256 \"[^\"]*\"/sha256 \"${TARBALL_SHA}\"/" "$FORMULA_FILE"

          cd "$RUNNER_TEMP/homebrew-tap"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/splashdown.rb
          git diff --cached --quiet && echo "no changes to push" && exit 0
          git commit -m "Update splashdown to ${VERSION}"
          git push
