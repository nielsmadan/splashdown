# Example consumer mise.toml. `splash init` adds the [env] _.file line for you;
# this shows the end state.

[env]
_.file = "splashdown.env"

[tasks.wt-provision]
description = "Provision per-worktree resources from splashdown.toml"
run = "splash"
silent = true

[tasks."wt-list"]
description = "Show this checkout's resolved resources"
run = "splash list"

[tasks."wt-gc"]
description = "Garbage-collect dead registry entries"
run = "splash gc"

[tasks.sim]
description = "Boot the iOS sim declared for this checkout"
run = "splash device boot iphone"

[tasks.run]
description = "Boot device + build + run the app (framework auto-detected)"
run = "splash device run"
