# Example consumer mise.toml. `splash init` adds the [env] _.file line for you;
# this shows the end state.

[env]
_.file = "splashdown.env"

[tasks.wt-provision]
description = "Provision per-worktree resources from splashdown.toml"
run = "splash"
silent = true

[tasks."wt-list"]
description = "Show this checkout's resolved resources"
run = "splash list"

[tasks."wt-gc"]
description = "Garbage-collect dead registry entries"
run = "splash gc"

[tasks.sim]
description = "Boot this checkout's iOS sim (auto-creates / auto-upgrades on latest)"
run = "splash boot simulator"

[tasks.run]
description = "Boot sim + build + launch the app (framework auto-detected)"
run = "splash run simulator"
