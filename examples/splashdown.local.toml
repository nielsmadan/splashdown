# splashdown.local.toml — per-checkout additional device variants.
# Gitignored. Recipe variants are NOT repeated here — only additions go here.
# Name collisions with recipe variants are an error; pick a distinct name.

# Example: a one-off iPhone 16 sim to reproduce a bug only this checkout sees:
# [devices.ios-sim.repro-bug]
# model = "iPhone 16"
# ios   = "17.5"
#
# Or via CLI:
#   splash device add ios-sim repro-bug --model="iPhone 16" --ios=17.5
