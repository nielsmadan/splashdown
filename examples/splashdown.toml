# splashdown.toml — committed recipe. Per-checkout resource schema only.

[resources.RCT_METRO_PORT]
type  = "port"
range = [8081, 8200]

[resources.STORYBOOK_PORT]
type  = "port"
range = [6006, 6100]

[resources.RUN_ID]
type = "uuid"

[resources.SIM_NAME]
type     = "template"
template = "{{ basename(parent) }}/{{ cwd }}"

[resources.METRO_URL]
type     = "template"
template = "http://localhost:{{ RCT_METRO_PORT }}"

[project]
framework = "react-native"   # auto | react-native | flutter | expo
