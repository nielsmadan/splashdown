# splashdown.toml — committed recipe. Resource slots + device variants.

[resources.RCT_METRO_PORT]
type  = "port"
range = [8082, 8200]

[resources.STORYBOOK_PORT]
type  = "port"
range = [6007, 6100]

[resources.RUN_ID]
type = "uuid"

[resources.METRO_URL]
type     = "template"
template = "http://localhost:{{ RCT_METRO_PORT }}"

# Device variants the team agrees this project supports. Sim *instances* are
# created lazily per checkout, named `<parent>/<cwd>/<variant>`. `ios = "latest"`
# (default) auto-recreates the sim when a newer iOS lands; pin with an explicit
# version like `ios = "18.5"` for fixed version coverage.
[targets.simulator.default]
model = "iPhone 17"

# Optional additional team-wide variants:
# [targets.simulator.lowest-supported]
# model = "iPhone 12"
# ios   = "17.0"
# [targets.simulator.small-screen]
# model = "iPhone 13 Mini"

[project]
framework = "react-native"   # auto | react-native | flutter | expo
