pre-commit:
  parallel: true
  commands:
    ruff-format:
      glob: "*.py"
      run: uv run ruff format --check {staged_files}
    ruff-lint:
      glob: "*.py"
      run: uv run ruff check {staged_files}

pre-push:
  commands:
    check:
      run: just check
      priority: 1
    coverage:
      # just check runs the tests; this re-runs them under --cov, which enforces
      # fail_under (see [tool.coverage.report]).
      run: uv run pytest -q --cov
      priority: 2
    docs:
      # Only when docs actually changed; strict fails the push on broken links/nav.
      glob:
        - "docs/user/**/*"
        - "mkdocs.yml"
        - "README.md"
      run: uv run --group docs zensical build -f mkdocs.yml --strict
      priority: 3

