pre-commit:
  parallel: true
  commands:
    ruff-format:
      glob: "*.py"
      run: uv run ruff format --check {staged_files}
    ruff-lint:
      glob: "*.py"
      run: uv run ruff check {staged_files}

pre-push:
  commands:
    mypy:
      run: uv run mypy
    tests:
      run: uv run pytest -q --cov  # --cov enforces fail_under (see [tool.coverage.report])
