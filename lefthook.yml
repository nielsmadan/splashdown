pre-commit:
  parallel: true
  commands:
    ruff-format:
      glob: "*.py"
      run: uv run ruff format --check {staged_files}
    ruff-lint:
      glob: "*.py"
      run: uv run ruff check {staged_files}

pre-push:
  commands:
    pylint:
      run: uv run pylint src/splashdown
    mypy:
      run: uv run mypy
    tests:
      run: uv run pytest -q --cov  # --cov enforces fail_under (see [tool.coverage.report])
    docs:
      # Only when docs actually changed; strict fails the push on broken links/nav.
      glob:
        - "docs/user/**/*"
        - "mkdocs.yml"
        - "README.md"
      run: uv run --group docs zensical build -f mkdocs.yml --strict
